<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>飞书与桌面 DeepSeek Harness：实现手机飞书远程完全对等交互</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20242d;
      --muted: #626b7a;
      --line: #d9dde5;
      --paper: #f5f6f8;
      --accent: #2364d2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 56px;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 22px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4.5vw, 48px);
      line-height: 1.14;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 21px);
      line-height: 1.5;
      font-weight: 600;
    }

    .source {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .source a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    figure {
      margin: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 18px 55px rgba(32, 36, 45, 0.12);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>飞书与桌面 DeepSeek Harness：实现手机飞书远程完全对等交互</h1>
      <p class="subtitle">Feishu and Desktop DeepSeek Harness: Enabling Fully Peer Remote Interaction from Mobile Feishu</p>
      <p class="source">
        Repository:
        <a href="https://github.com/Xianghuahuashdjd/DS">github.com/Xianghuahuashdjd/DS</a>
      </p>
    </header>

    <figure>
      <img src="preview-watermarked-github-redacted.png" alt="Feishu and Desktop DeepSeek Harness workflow">
    </figure>
  </main>
</body>
</html>
